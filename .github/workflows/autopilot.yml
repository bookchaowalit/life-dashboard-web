name: autopilot

# Unattended AI delivery loop. See .autopilot/README.md.
# Public repository → GitHub-hosted runner (CI hosting policy).
# Scheduled runs only fire when the repository variable AUTOPILOT_ENABLED is "true".
# Runs at 01:40 and 04:40 Asia/Bangkok: after the productivity-tracking-web pilot (:00) and
# portfolio-site-web (:20), so the three loops never start in the same minute.
# A merge to main deploys production (Vercel Git), so this copy never merges on its own:
# every passed task opens a PR that waits for the autopilot:approved label, and a merge
# also waits until the shared Vercel quota has more than 20 deploys left.
#
# Three jobs, each with only the tokens it needs (2026-11-18, closes the same-job/same-uid
# token risk): model output and repo code never run in a job that holds a GitHub write token.
#   plan       read-only GITHUB_TOKEN. Runs no repo code (no npm). Reads issues, PRs, CI and the
#              ledger, writes plan.json; its sha256 goes out as a job output.
#   merge-gate no token, no model. npm test on main + command gates on the merged trees of the
#              approved PRs (code a person approved); the result is a job output, which the work
#              job cannot overwrite (it could overwrite an artifact).
#   work       Claude token only (contents: read, no write scope). Maker, command gates, reviewers,
#              visual gate. Every GitHub write and Telegram message becomes an intent in result.json;
#              the commits it built go out as a git bundle (artifact).
#   publish    write token + Telegram + Vercel count. Runs no repo code (no npm). Verifies plan.json
#              against the plan job's sha256, re-checks approvals, Autopilot-Head, CI and the Vercel
#              quota on fresh state, checks every work intent against the plan (task issues and
#              branches only, commits from the verified bundle), then pushes exactly those commits,
#              opens PRs, merges approved PRs and writes the ledger.
# Every job runs the engine from the workflow's own commit (github.sha); the tree it works on is the
# base the plan read (base_sha), which the engine checks out itself.

on:
  schedule:
    - cron: "40 18 * * *"
    - cron: "40 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "real | dry-run"
        default: "dry-run"
        type: choice
        options: [dry-run, real]
      max_tasks:
        description: "Max tasks this run"
        default: "1"

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOPILOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      work: ${{ steps.plan.outputs.work }}
      merge_gate: ${{ steps.plan.outputs.merge_gate }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      args: ${{ steps.args.outputs.args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run arguments
        id: args
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MAX_TASKS: ${{ inputs.max_tasks }}
        run: |
          args=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$INPUT_MODE" = "dry-run" ] && args="--dry-run"
            [[ "$INPUT_MAX_TASKS" =~ ^[1-3]$ ]] || { echo "max_tasks must be 1-3"; exit 1; }
            args="$args --max-tasks $INPUT_MAX_TASKS"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Plan (read-only)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ARGS: ${{ steps.args.outputs.args }}
        run: |
          gh auth setup-git
          # shellcheck disable=SC2086
          python3 -I .autopilot/autopilot.py --phase plan --state-dir "$RUNNER_TEMP/autopilot-plan" $ARGS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autopilot-plan
          path: ${{ runner.temp }}/autopilot-plan/plan.json
          retention-days: 14
          if-no-files-found: error

  merge-gate:
    needs: plan
    if: needs.plan.outputs.merge_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No secrets and no model: runs main's npm test and the approved PRs' code on the merged trees.
    permissions:
      contents: read
    outputs:
      merge_gates: ${{ steps.gate.outputs.merge_gates }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autopilot-plan
          path: ${{ runner.temp }}/autopilot-state

      - name: Git identity (local merge commits only; this job cannot push)
        run: |
          git config user.name "autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Gate merged trees of approved PRs
        id: gate
        env:
          PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
          ARGS: ${{ needs.plan.outputs.args }}
        run: |
          # shellcheck disable=SC2086
          python3 -I .autopilot/autopilot.py --phase merge-gate --state-dir "$RUNNER_TEMP/autopilot-state" \
            --plan-sha256 "$PLAN_SHA256" $ARGS

  work:
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No write scope: this job runs model output (the maker's code through npm test/build, the
    # visual gate's next start). contents: read only lets checkout read this public repository.
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the engine from the workflow's commit; the engine checks out the plan's base itself
          ref: ${{ github.sha }}
          fetch-depth: 0
          # No token in .git/config: later fetches are anonymous (public repository).
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install agent CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: Install Playwright for the visual gate
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autopilot-plan
          path: ${{ runner.temp }}/autopilot-state

      - name: Git identity (local commits only; this job cannot push)
        run: |
          git config user.name "autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Work (maker, gates, reviewers)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
          ARGS: ${{ needs.plan.outputs.args }}
        run: |
          # shellcheck disable=SC2086
          python3 -I .autopilot/autopilot.py --phase work --state-dir "$RUNNER_TEMP/autopilot-state" \
            --plan-sha256 "$PLAN_SHA256" $ARGS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: autopilot-result
          path: |
            ${{ runner.temp }}/autopilot-state/result.json
            ${{ runner.temp }}/autopilot-state/work.bundle
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: [plan, merge-gate, work]
    # runs after a skipped or failed work job too: it still writes the ledger and notifies
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # actions: write lets the loop dispatch ci.yml on its PR branches (a GITHUB_TOKEN PR starts no workflow)
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the engine from the workflow's commit (same as plan and work), never from a job's output
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autopilot-plan
          path: ${{ runner.temp }}/autopilot-plan

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.work.result != 'skipped'
        continue-on-error: true  # no result → publish records a run error
        with:
          name: autopilot-result
          path: ${{ runner.temp }}/autopilot-result

      - name: Git identity
        env:
          GH_TOKEN: ${{ github.token }}
        # git push/fetch get the token from gh (GH_TOKEN). This job runs no repo code.
        run: |
          gh auth setup-git
          git config user.name "autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Count free Vercel deployments (shared team quota)
        # Only this step sees the Vercel token; the publish step gets just the number.
        # No token or an API error leaves the count empty and approved PRs wait.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          python3 -I - <<'PY' >> "$GITHUB_ENV" || true
          import json, os, time, urllib.request
          token, team = os.environ.get("VERCEL_TOKEN"), os.environ.get("VERCEL_TEAM_ID")
          if token and team:
              since, until, used = int((time.time() - 86400) * 1000), None, 0
              for _ in range(5):
                  url = f"https://api.vercel.com/v6/deployments?teamId={team}&since={since}&limit=100" + (f"&until={until}" if until else "")
                  page = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"}), timeout=30))
                  used += len(page.get("deployments", []))
                  until = (page.get("pagination") or {}).get("next")
                  if not until or len(page.get("deployments", [])) < 100:
                      break
              print(f"VERCEL_FREE_DEPLOYS={100 - used}")
          PY
          grep -q VERCEL_FREE_DEPLOYS "$GITHUB_ENV" && echo "counted" || echo "quota unknown: approved PRs will wait"

      - name: Publish (checked intents, pushes, PRs, merges, ledger)
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
          MERGE_GATES: ${{ needs.merge-gate.outputs.merge_gates }}
          ARGS: ${{ needs.plan.outputs.args }}
        run: |
          # shellcheck disable=SC2086
          python3 -I .autopilot/autopilot.py --phase publish --merge-gates "$MERGE_GATES" --state-dir "$RUNNER_TEMP/autopilot-plan" \
            --result-dir "$RUNNER_TEMP/autopilot-result" --plan-sha256 "$PLAN_SHA256" $ARGS
